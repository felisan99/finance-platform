# Configuración de Supabase que se gestiona desde el repo con `supabase config push`.
#
# NO es la plantilla completa de `supabase init`. No usamos Supabase local (sin Docker) y un
# push con esa plantilla pisaba ajustes reales del proyecto en la nube (site URL, confirmación
# de email, largo del OTP, pooler…). Acá solo se declara lo que queremos versionar; lo que no
# está declarado no se toca. Referencia: https://supabase.com/docs/guides/local-development/cli/config
#
# Regla: antes de `supabase config push`, correr `pnpm db:config-diff` y revisar el diff
# (sin TTY la CLI aplica los cambios sin preguntar).
#
# Las plantillas de correo se declaran acá desde que hay SMTP propio (con el correo por defecto
# de Supabase, el plan Free rechaza modificarlas: 400 "Email template modification is not
# available…"). El bloque [auth.email.smtp] NO se declara a propósito: la contraseña de
# aplicación de Gmail vive solo en el panel de Supabase y un `config push` no debe pisarla.

project_id = "finance-platform"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
# Token de acceso de 1 semana (el máximo; por defecto 1 h). Cada renovación rota el refresh token
# y, si la respuesta con las cookies nuevas no llega (iOS suspende la app instalada a mitad de una
# petición), el siguiente uso del token viejo pasados 10 s revoca la sesión entera: con 1 h la
# sesión del teléfono moría en un par de días. Costo aceptado: un token de acceso robado o de una
# sesión cerrada sigue valiendo hasta vencer (las cookies son HttpOnly). Ver docs/decisions.md.
jwt_expiry = 604800

# Registro solo por invitación: rechaza el alta si el email no está en public.allowed_emails
# (función creada en la migración signup_gate_and_defaults).
# Ingreso con código de 6 dígitos (no con enlace: el enlace abre Safari y no la app instalada).
# `otp_length` tiene que coincidir con CODE_LENGTH de lib/validation/login.ts. `max_frequency`
# es la espera mínima entre dos correos al mismo email: el botón "Reenviar" espera lo mismo.
[auth.email]
otp_length = 6
otp_expiry = 600
max_frequency = "1m0s"

# Supabase manda una u otra según el email ya exista (magic_link) o sea un alta nueva
# (confirmation): las dos muestran solo el código. El asunto también lleva el código (Auth lo
# procesa como plantilla, igual que el cuerpo): se lee en la notificación sin abrir el correo y
# cada correo queda en su propia conversación (con el mismo asunto, Gmail los agrupa y el nuevo
# queda escondido debajo del viejo).
[auth.email.template.magic_link]
subject = "{{ .Token }} es tu código de ingreso a Portfolio Tracker"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "{{ .Token }} es tu código de ingreso a Portfolio Tracker"
content_path = "./supabase/templates/confirmation.html"

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_before_user_created"
