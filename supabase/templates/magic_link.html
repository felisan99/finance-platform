<!doctype html>
<html lang="es">
  <body style="margin:0;padding:24px;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#0a0a0a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;margin:0 auto;background:#ffffff;border:1px solid #e5e5e5;border-radius:12px;">
      <tr>
        <td style="padding:28px 24px;">
          <p style="margin:0 0 4px;font-size:14px;color:#737373;">Portfolio Tracker</p>
          <h1 style="margin:0 0 16px;font-size:20px;font-weight:600;">Tu código de ingreso</h1>
          <p style="margin:0 0 16px;font-size:15px;line-height:1.5;">
            Escribí este código en la pantalla de ingreso:
          </p>
          <p style="margin:0 0 20px;padding:14px 0;text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:32px;font-weight:600;letter-spacing:8px;background:#f5f5f5;border-radius:8px;">{{ .Token }}</p>
          <p style="margin:0 0 8px;font-size:14px;line-height:1.5;color:#525252;">
            Vence en 10 minutos y sirve una sola vez.
          </p>
          <p style="margin:0;font-size:14px;line-height:1.5;color:#525252;">
            Si no lo pediste vos, ignorá este correo: sin el código nadie puede ingresar.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
